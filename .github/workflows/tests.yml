name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The unit and synthetic tests need no GPU, weights or video: torch is not installed.
      - run: pip install numpy==2.3.5 scipy==1.16.3 opencv-python-headless==4.13.0.92 PyYAML==6.0.3 pytest==8.4.2 ruff==0.16.9
      - run: ruff check .
      - run: python -m pytest -q tests
