# Lint settings for our code. The organizers' files and research notes are excluded.
line-length = 120
target-version = "py310"
extend-exclude = ["research", "evaluate.py", "run_submission.py", "docs"]

[lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "B008", "B905"]

[lint.isort]
known-first-party = ["trafficwatch"]
